services:
  audio-processor-api:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    container_name: audio-processor-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - FRONTEND_ORIGIN=http://localhost:5173
    volumes:
      - ../models:/models:ro
  odeoia-frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - audio-processor-api
