variables:
  NUGET_PACKAGES_DIR: "$CI_PROJECT_DIR/.nuget/packages"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_NOLOGO: "true"

stages:
  - lint
  - build
  - test

# Keep this changes: list in sync with the shell `case` classification in
# scripts/git-hooks/pre-push — GitLab's `rules: changes:` is evaluated
# statically by the runner, so it can't delegate to a shared script the way
# the actual validation commands do via Make (AGENTS.md section 12).
.backend-rules: &backend-rules
  rules:
    - changes:
        - backend/**/*
        - Makefile
        - .gitlab-ci.yml
        - .gitignore
        - infrastructure/**/*
        - scripts/**/*

.frontend-rules: &frontend-rules
  rules:
    - changes:
        - frontend/**/*
        - Makefile
        - .gitlab-ci.yml
        - .gitignore
        - infrastructure/**/*
        - scripts/**/*
        - AGENTS.md

.dotnet-job: &dotnet-job
  image: mcr.microsoft.com/dotnet/sdk:8.0
  cache:
    key: "$CI_COMMIT_REF_SLUG-dotnet"
    paths:
      - .nuget/packages/
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends make && rm -rf /var/lib/apt/lists/*

backend-lint:
  <<: [*dotnet-job, *backend-rules]
  stage: lint
  script: ["make backend-lint"]

backend-build:
  <<: [*dotnet-job, *backend-rules]
  stage: build
  script: ["make backend-build"]

backend-test:
  <<: [*dotnet-job, *backend-rules]
  stage: test
  script: ["make backend-test"]

.node-job: &node-job
  image: node:24-alpine
  cache:
    key: "$CI_COMMIT_REF_SLUG-frontend"
    paths: [frontend/.npm/]
  before_script:
    - apk add --no-cache make
    - npm ci --prefix frontend --cache frontend/.npm

frontend-lint:
  <<: [*node-job, *frontend-rules]
  stage: lint
  script: ["make frontend-lint"]

frontend-build:
  <<: [*node-job, *frontend-rules]
  stage: build
  script: ["make frontend-build"]

frontend-test:
  <<: [*node-job, *frontend-rules]
  stage: test
  script: ["make frontend-test"]
