variables:
  NUGET_PACKAGES_DIR: "$CI_PROJECT_DIR/.nuget/packages"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_NOLOGO: "true"

stages:
  - lint
  - build
  - test

.backend-rules: &backend-rules
  rules:
    - changes:
        - backend/**/*
        - Makefile
        - .gitlab-ci.yml
        - .gitignore
        - infrastructure/**/*
        - scripts/**/*

.frontend-rules: &frontend-rules
  rules:
    - changes:
        - frontend/**/*
        - Makefile
        - .gitlab-ci.yml
        - .gitignore
        - infrastructure/**/*
        - scripts/**/*

.dotnet-job: &dotnet-job
  image: mcr.microsoft.com/dotnet/sdk:8.0
  cache:
    key: "$CI_COMMIT_REF_SLUG-dotnet"
    paths:
      - .nuget/packages/
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends make && rm -rf /var/lib/apt/lists/*

backend-lint:
  <<: [*dotnet-job, *backend-rules]
  stage: lint
  script: ["make backend-lint"]

backend-build:
  <<: [*dotnet-job, *backend-rules]
  stage: build
  script: ["make backend-build"]

backend-test:
  <<: [*dotnet-job, *backend-rules]
  stage: test
  script: ["make backend-test"]

frontend-lint:
  image: node:24-alpine
  <<: *frontend-rules
  stage: lint
  cache:
    key: "$CI_COMMIT_REF_SLUG-frontend"
    paths: [frontend/.npm/]
  before_script:
    - npm ci --prefix frontend --cache frontend/.npm
  script: ["npm run lint --prefix frontend"]

frontend-build:
  image: node:24-alpine
  <<: *frontend-rules
  stage: build
  cache:
    key: "$CI_COMMIT_REF_SLUG-frontend"
    paths: [frontend/.npm/]
  before_script:
    - npm ci --prefix frontend --cache frontend/.npm
  script: ["npm run build --prefix frontend"]
