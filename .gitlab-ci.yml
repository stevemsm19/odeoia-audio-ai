# Global configurations and variables for .NET CI Pipeline
variables:
  # Define the path to cache NuGet packages locally
  NUGET_PACKAGES_DIR: "$CI_PROJECT_DIR/.nuget/packages"
  # Opt-out of .NET CLI telemetry messages to clean up console logs
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  # Suppress the welcome logo on dotnet CLI executions
  DOTNET_NOLOGO: "true"

# Define the global caching policy for NuGet packages across stages
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .nuget/packages/

stages:
  - lint
  - build
  - test

lint:
  stage: lint
  image: mcr.microsoft.com/dotnet/sdk:8.0
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .nuget/packages/
    policy: pull
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends make && rm -rf /var/lib/apt/lists/*
    - dotnet restore backend/AudioProcessor.sln
  script:
    - make lint

build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:8.0
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends make && rm -rf /var/lib/apt/lists/*
  script:
    - make build

test:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:8.0
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .nuget/packages/
    policy: pull
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends make && rm -rf /var/lib/apt/lists/*
  script:
    - make test